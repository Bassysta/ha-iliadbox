create_guest_wifi:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: iliadbox
    description:
      required: false
      example: "Weekend guests"
      selector:
        text:
    password:
      example: "Holiday2026"
      selector:
        text:
    duration_hours:
      default: 24
      selector:
        number:
          min: 1
          max: 8760
          unit_of_measurement: h
          mode: box
    max_devices:
      default: 0
      selector:
        number:
          min: 0
          max: 100
          mode: box
    access_type:
      default: net_only
      selector:
        select:
          translation_key: access_type
          options:
            - net_only
            - full

delete_guest_wifi:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: iliadbox
    access_id:
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
