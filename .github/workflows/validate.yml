name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.12'
            requirements: requirements-test.txt
          - python: '3.14'
            requirements: requirements-test-recent.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m pytest -q --cov=custom_components.iliadbox --cov-fail-under=75

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx prettier --check 'custom_components/iliadbox/frontend/*.js' 'tests/frontend/*.js'

  current-import:
    name: Import on HA 2026.11.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.11.2 segno==1.6.6
      - run: python -c 'import custom_components.iliadbox.config_flow; import custom_components.iliadbox.sensor; import custom_components.iliadbox.image'
